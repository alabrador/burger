# Copia diaria cifrada de la base de datos + simulacro de restauración.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  conexión DIRECTA a Postgres de producción (sin "-pooler")
#   BACKUP_PASSPHRASE    frase larga para cifrar las copias (guárdala también fuera de GitHub)
#
# Cada copia se guarda como artefacto del workflow: 30 días las diarias y 90 las de los domingos.
# Si la copia o el simulacro fallan, GitHub envía un correo de fallo.
name: Copia de seguridad

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC (04:30/05:30 en Madrid), fuera de horario de pedidos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  PG_MAJOR: "18" # pg_dump más nuevo que el servidor siempre funciona; al revés no

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de Postgres ${{ env.PG_MAJOR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" >/dev/null
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >>"$GITHUB_PATH"
      - name: Copia cifrada
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup/backup.sh backups
      - id: meta
        run: |
          echo "name=copia-$(date -u +%Y%m%d)-${{ github.run_id }}" >>"$GITHUB_OUTPUT"
          # Las del domingo se guardan 90 días; el resto 30.
          if [ "$(date -u +%u)" = 7 ]; then echo "days=90" >>"$GITHUB_OUTPUT"; else echo "days=30" >>"$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: ${{ steps.meta.outputs.days }}
          compression-level: 0 # ya va comprimida y cifrada
          if-no-files-found: error

  # Simulacro: restaura la copia recién hecha en un Postgres vacío y comprueba los datos.
  drill:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:18
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U drill" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de Postgres ${{ env.PG_MAJOR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" >/dev/null
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.backup.outputs.name }}
          path: backups
      - name: Restaurar y comprobar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_DATABASE_URL: postgres://drill:drill@localhost:5432/drill
        run: |
          scripts/backup/restore.sh backups/*.dump.gpg --yes
          scripts/backup/verify.sh | tee -a "$GITHUB_STEP_SUMMARY"
